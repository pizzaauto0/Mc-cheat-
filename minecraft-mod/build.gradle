plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Leichtgewichtiger lokaler WebSocket-Server fuer die Kommunikation mit der
    // Electron-App. Wird per Jar-in-Jar mit ausgeliefert (include), damit Nutzer
    // keine separate Bibliothek installieren muessen.
    implementation "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
    include "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Diagnose-Task: durchsucht alle Abhaengigkeits-Jars nach Klassen mit einem der
// angegebenen einfachen Namen und druckt den vollen (aktuellen) Paketpfad. Damit
// laesst sich schnell herausfinden, wohin eine Klasse in dieser Mapping-Version
// verschoben wurde, ohne die Jars von Hand zu durchsuchen.
// Aufruf: gradlew.bat findSymbols
tasks.register('findSymbols') {
    doLast {
        def targets = ['GameRules', 'ArmorItem', 'WorldRenderEvents', 'WorldRenderContext',
                        'ClientLifecycleEvents', 'RenderLayer', 'FoodComponent', 'EntityAttributes']
        sourceSets.main.compileClasspath.files.each { f ->
            if (!f.name.endsWith('.jar')) return
            try {
                new java.util.jar.JarFile(f).withCloseable { jar ->
                    jar.entries().each { entry ->
                        def name = entry.name
                        if (!name.endsWith('.class') || name.contains('$')) return
                        def simple = name.substring(name.lastIndexOf('/') + 1, name.length() - 6)
                        if (targets.contains(simple)) {
                            println "${simple} -> ${name.replace('/', '.').replace('.class', '')}   (${f.name})"
                        }
                    }
                }
            } catch (Exception ignored) {
                // nicht lesbare/relevante Jars ueberspringen
            }
        }
    }
}
