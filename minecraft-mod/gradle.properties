# Prüfe vor dem Bauen aktuelle Werte auf https://fabricmc.net/develop/ für
# Minecraft-Version 1.21.11 -- diese Versionen aendern sich regelmaessig.

# Minecraft
minecraft_version=1.21.11
loader_version=0.18.1

# Loom-Version (Gradle-Plugin, siehe build.gradle). Muss eine exakte Version sein,
# die plugins{}-DSL akzeptiert keine Versions-Ranges wie "1.14.+".
loom_version=1.14

# Fabric API
fabric_api_version=0.140.2+1.21.11

# Mod Properties
mod_version=0.1.0
maven_group=net.pizzaauto.cheatbridge
archives_base_name=cheatbridge

# Java-WebSocket (fuer den lokalen Bridge-Server, wird als Jar-in-Jar mitgeliefert)
java_websocket_version=1.5.7
