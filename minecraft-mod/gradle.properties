# Werte von https://fabricmc.net/develop/ (Minecraft 1.21.11), Stand: siehe Chatverlauf.
# Falls ein spaeterer Build fehlschlaegt: dort nochmal nachschauen und aktualisieren.

# Minecraft
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3

# Loom-Version (Gradle-Plugin, siehe build.gradle). Muss eine exakte Version sein,
# die plugins{}-DSL akzeptiert keine Versions-Ranges wie "1.14.+".
loom_version=1.17-SNAPSHOT

# Fabric API
fabric_api_version=0.141.6+1.21.11

# Mod Properties
mod_version=0.1.0
maven_group=net.pizzaauto.cheatbridge
archives_base_name=cheatbridge

# Java-WebSocket (fuer den lokalen Bridge-Server, wird als Jar-in-Jar mitgeliefert)
java_websocket_version=1.5.7
